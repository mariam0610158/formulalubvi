<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>По какому кругу ходит твоя любовь</title>
<meta name="description" content="11 коротких вопросов, 5 минут. Увидишь своими словами формулу, по которой складываются твои отношения, и поймёшь, почему всё идёт по одному кругу.">
<meta name="theme-color" content="#120E19">
<meta property="og:title" content="По какому кругу ходит твоя любовь">
<meta property="og:description" content="Мужчины разные, а чувствуешь ты себя с ними почти одинаково? Тест на 5 минут.">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23120E19'/%3E%3Cpath d='M8 27V14a8 8 0 0 1 16 0v13' fill='none' stroke='%23F2D392' stroke-width='1.6'/%3E%3Ccircle cx='16' cy='13' r='3.2' fill='%23F2D392'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Onest:wght@400;500;600&display=swap">
<style>/* Concept: ночь с золотым светом в арке (обложка, сборка, формула) + тёплый закатный день из штукатурки и льна (вопросы, разбор). */
:root{
  --night:#120E19; --night-2:#1E1726; --dusk:#3B2735; --glow:#F2D392; --gold:#C9A15C; --gold-ink:#86652F;
  --sand:#F2E8DC; --linen:#FBF6EF; --clay:#E6D6C4; --peach:#F0D8C5; --ink:#2A2030; --muted:#6D5E66;
  --terra:#A65A42; --olive:#6F7D5C; --cream:#F6EAD3;
  --f-display:"Cormorant Garamond","Cormorant",Georgia,"Times New Roman",serif;
  --f-body:"Onest","Manrope",-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --r:18px; --ease:cubic-bezier(.2,.7,.2,1);
  color-scheme:light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;height:100%}
body{margin:0;min-height:100%;background:var(--sand);color:var(--ink);font:400 17px/1.55 var(--f-body);-webkit-font-smoothing:antialiased;overflow-x:hidden}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
a{color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px;border-radius:8px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* фон дня: штукатурка, зерно, светлая арка */
.day-bg{position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
   radial-gradient(120% 60% at 50% -10%, #FFF8EE 0%, rgba(255,248,238,0) 60%),
   radial-gradient(90% 50% at 100% 100%, rgba(233,178,140,.28), rgba(233,178,140,0) 70%),
   var(--sand)}
.day-bg::before{content:"";position:absolute;left:50%;top:-40px;transform:translateX(-50%);width:min(640px,140vw);height:520px;
  border-radius:50% 50% 0 0/42% 42% 0 0;background:linear-gradient(#FFFAF3,rgba(255,250,243,0) 85%);opacity:.75}
.day-bg::after{content:"";position:absolute;inset:0;opacity:.35;mix-blend-mode:multiply;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .55  0 0 0 0 .45  0 0 0 0 .38  0 0 0 .22 0'/></filter><rect width='160' height='160' filter='url(%23n)'/></svg>")}

.wrap{width:100%;max-width:560px;margin:0 auto;padding-inline:20px}

/* ---------- НОЧЬ ---------- */
.night{position:relative;color:var(--cream);background:
  radial-gradient(80% 40% at 50% 104%, rgba(236,160,110,.55), rgba(236,160,110,0) 70%),
  radial-gradient(60% 30% at 50% 100%, rgba(255,214,150,.35), rgba(255,214,150,0) 70%),
  linear-gradient(180deg,#0E0B14 0%,#171221 45%,#2A1C2A 80%,#4A2C32 100%);overflow:hidden;isolation:isolate}
.night canvas.dust{position:absolute;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none}
.night .wrap{position:relative}

.cover{min-height:100svh;min-height:100dvh;display:flex;flex-direction:column;padding-block:28px 40px}
.author{display:flex;align-items:center;justify-content:center;gap:10px;font:500 12px/1 var(--f-body);letter-spacing:.22em;text-transform:uppercase;color:rgba(242,211,146,.8);text-align:center;margin:0 0 22px}
.arch{position:relative;width:min(78vw,330px);aspect-ratio:3/4;max-width:100%;margin:0 auto;
  border:1px solid rgba(242,211,146,.75);border-bottom:0;border-radius:50% 50% 0 0/37.5% 37.5% 0 0;
  display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:0 22px 26px;text-align:center}
.arch::before{content:"";position:absolute;inset:9px 9px 0;border:1px solid rgba(242,211,146,.28);border-bottom:0;border-radius:inherit;
  background:radial-gradient(70% 55% at 50% 20%, rgba(242,211,146,.28), rgba(242,211,146,0) 70%),
             linear-gradient(180deg,rgba(242,211,146,.08),rgba(242,211,146,0) 60%);}
.arch::after{content:"";position:absolute;left:-14%;right:-14%;bottom:-1px;height:1px;background:linear-gradient(90deg,transparent,rgba(242,211,146,.9),transparent)}
.moon{position:absolute;top:15%;left:50%;width:46px;height:46px;margin-left:-23px;border-radius:50%;
  box-shadow:10px -6px 0 0 var(--glow);transform:rotate(-18deg);filter:drop-shadow(0 0 14px rgba(242,211,146,.75))}
.arch h1{position:relative;margin:0;font:500 clamp(36px,10vw,46px)/1.02 var(--f-display);letter-spacing:-.01em;color:#FBEFD6;text-wrap:balance}
.arch h1 em{font-style:italic;color:var(--glow)}
.reflect{height:44px;margin:0 auto;width:min(78vw,330px);max-width:100%;
  background:repeating-linear-gradient(180deg,rgba(242,211,146,.35) 0 1px,transparent 1px 7px);
  -webkit-mask:radial-gradient(50% 100% at 50% 0,#000 0,transparent 75%);mask:radial-gradient(50% 100% at 50% 0,#000 0,transparent 75%);opacity:.7}
.lead{font:400 18px/1.55 var(--f-body);color:rgba(246,234,211,.88);margin:18px 0 22px;text-wrap:pretty}
.badges{display:flex;flex-wrap:wrap;gap:8px;list-style:none;padding:0;margin:16px 0 0;justify-content:center}
.badges li{font:500 13px/1 var(--f-body);padding:9px 12px;border:1px solid rgba(242,211,146,.35);border-radius:999px;color:rgba(246,234,211,.85)}
.hint{font-size:14px;color:rgba(246,234,211,.62);text-align:center;margin:14px 0 0}
.trust{margin-top:26px;padding:18px 18px 16px;border-top:1px solid rgba(242,211,146,.3);border-bottom:1px solid rgba(242,211,146,.3)}
.trust b{display:block;font:500 22px/1.2 var(--f-display);color:var(--glow);margin-bottom:8px}
.trust p{margin:0;font-size:15px;color:rgba(246,234,211,.78)}
.fine{font-size:12.5px;color:rgba(246,234,211,.5);text-align:center;margin:18px 0 0}

.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:56px;padding:14px 22px;border-radius:999px;border:0;font:600 17px/1.2 var(--f-body);text-decoration:none;text-align:center;transition:transform .2s var(--ease),box-shadow .2s,background .2s,opacity .2s}
.btn:active{transform:scale(.98)}
.btn-gold{background:linear-gradient(180deg,#F6DEA4,#D9AE63);color:#2A1D16;box-shadow:0 0 0 1px rgba(255,236,190,.6) inset,0 10px 30px -8px rgba(242,190,110,.65)}
.btn-ghost{background:transparent;color:var(--glow);border:1px solid rgba(242,211,146,.5)}
.btn-ink{background:var(--ink);color:#FBF2E4;box-shadow:0 0 0 1px rgba(201,161,92,.5) inset}
.btn-ink[disabled]{opacity:.35;cursor:default}
.btn-soft{background:var(--linen);color:var(--ink);border:1px solid var(--clay)}
.btn-line{background:none;border:0;min-height:44px;color:var(--muted);font:500 15px/1.3 var(--f-body);text-decoration:underline;text-underline-offset:4px;text-decoration-color:rgba(109,94,102,.4)}

/* ---------- ВОПРОСЫ ---------- */
.qtop{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;gap:14px;padding:14px 0 12px;
  background:linear-gradient(var(--sand) 70%,rgba(242,232,220,0))}
.back{flex:none;width:44px;height:44px;border-radius:50%;border:1px solid var(--clay);background:var(--linen);display:grid;place-items:center}
.back svg{width:18px;height:18px}
.prog{flex:1;height:3px;border-radius:3px;background:rgba(134,101,47,.15);overflow:hidden}
.prog i{display:block;height:100%;background:linear-gradient(90deg,#D9AE63,#B98A42);border-radius:3px;transition:width .5s var(--ease)}
.qbody{padding-block:8px 28px;animation:rise .45s var(--ease) both}
@keyframes rise{from{opacity:.0;transform:translateY(10px)}to{opacity:1;transform:none}}
.scene-pin{display:flex;gap:10px;align-items:flex-start;margin:0 0 18px;padding:11px 14px;border-radius:14px;background:rgba(251,246,239,.7);border:1px dashed rgba(134,101,47,.3);font:italic 500 17px/1.35 var(--f-display);color:var(--muted)}
.scene-pin span{font:600 10.5px/1.6 var(--f-body);letter-spacing:.16em;text-transform:uppercase;color:var(--gold-ink);flex:none;padding-top:2px}
.qt{font:500 clamp(28px,7.4vw,34px)/1.1 var(--f-display);margin:0 0 10px;text-wrap:balance;letter-spacing:-.005em}
.qt q{quotes:"«" "»";font-style:italic;color:var(--terra)}
.qs{margin:0 0 20px;color:var(--muted);font-size:16px;text-wrap:pretty}
.opts{display:grid;gap:10px}
.opt{position:relative;display:flex;align-items:center;gap:12px;width:100%;min-height:58px;padding:14px 16px 14px 18px;text-align:left;
  background:var(--linen);border:1px solid var(--clay);border-radius:var(--r);font:400 17px/1.35 var(--f-body);color:var(--ink);
  transition:border-color .2s,background .2s,transform .15s,box-shadow .2s;box-shadow:0 1px 0 rgba(255,255,255,.7) inset}
.opt:hover{border-color:#D3B98E}
.opt:active{transform:scale(.99)}
.opt .tx{flex:1;min-width:0}
.opt .mk{flex:none;width:22px;height:22px;border-radius:50%;border:1.5px solid #CDB89A;display:grid;place-items:center;transition:.2s}
.opt.multi .mk{border-radius:7px}
.opt[aria-pressed="true"]{background:var(--peach);border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset}
.opt[aria-pressed="true"] .mk{background:var(--ink);border-color:var(--ink)}
.opt[aria-pressed="true"] .mk::after{content:"";width:9px;height:5px;border:2px solid #F6E3BE;border-top:0;border-right:0;transform:translateY(-1px) rotate(-45deg)}
.opt.own{border-style:dashed;color:var(--muted)}
.opt.dim{opacity:.45}
.ownbox{display:grid;gap:10px;margin-top:4px}
.field{width:100%;min-height:54px;padding:14px 16px;border-radius:14px;border:1px solid var(--clay);background:#fff;font-size:17px}
.field:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(201,161,92,.18)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.qfoot{display:grid;gap:6px;margin-top:22px}
.unsafe{display:block;margin:26px auto 0;background:none;border:0;color:var(--muted);font-size:13.5px;text-decoration:underline;text-underline-offset:3px;text-decoration-color:rgba(109,94,102,.35);min-height:40px}
.note{font-size:14px;color:var(--muted);margin:16px 0 0;text-align:center}

/* экран 3: слова */
.words{display:grid;gap:4px;margin:6px 0 16px}
.wline{display:flex;align-items:baseline;gap:10px;border-bottom:1px solid #D9C7B1;padding:8px 2px}
.wline label{font:italic 500 20px/1 var(--f-display);color:var(--gold-ink);flex:none}
.wline input{flex:1;min-width:0;border:0;background:transparent;font:italic 500 26px/1.2 var(--f-display);color:var(--ink);padding:4px 0}
.wline input:focus{outline:none}
.wline:focus-within{border-color:var(--gold)}
.chips-h{font:600 11px/1 var(--f-body);letter-spacing:.16em;text-transform:uppercase;color:var(--gold-ink);margin:8px 0 10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:40px;padding:8px 14px;border-radius:999px;border:1px solid var(--clay);background:var(--linen);font-size:15px;transition:.2s}
.chip[aria-pressed="true"]{background:var(--ink);color:#F6E3BE;border-color:var(--ink)}

/* мини-формула растёт */
.mini{margin:22px 0 0;padding:16px 18px;border-radius:16px;background:linear-gradient(160deg,#1C1524,#2C1F2C);color:var(--cream);box-shadow:0 0 0 1px rgba(201,161,92,.45) inset}
.mini h4{margin:0 0 8px;font:600 10.5px/1 var(--f-body);letter-spacing:.18em;text-transform:uppercase;color:var(--glow)}
.mini p{margin:4px 0;font:italic 500 17px/1.3 var(--f-display);color:rgba(246,234,211,.9)}
.mini p b{font:500 12px/1 var(--f-body);font-style:normal;color:rgba(242,211,146,.75);letter-spacing:.04em;margin-right:6px}
.mini p.empty{opacity:.35}

/* ---------- СБОРКА ---------- */
.assemble{min-height:100svh;min-height:100dvh;display:flex;flex-direction:column;justify-content:center;padding-block:40px}
.as-cap{font:italic 500 22px/1.3 var(--f-display);text-align:center;color:var(--glow);min-height:30px;margin:0 0 22px;transition:opacity .4s}
.as-card .ln{opacity:0;transform:translateY(12px);filter:blur(6px);transition:opacity .7s var(--ease),transform .7s var(--ease),filter .7s}
.as-card .ln.on{opacity:1;transform:none;filter:none}

/* ---------- КАРТОЧКА-ФОРМУЛА ---------- */
.fcard{position:relative;margin:0 auto;max-width:440px;padding:68px 26px 26px;border-radius:200px 200px 22px 22px/170px 170px 22px 22px;
  background:radial-gradient(90% 40% at 50% 0%, rgba(242,211,146,.18), rgba(242,211,146,0) 70%),linear-gradient(180deg,#1A1422,#251A27);
  box-shadow:0 0 0 1px rgba(242,211,146,.7),0 0 0 7px #1A1422,0 0 0 8px rgba(242,211,146,.3),0 30px 60px -20px rgba(0,0,0,.6)}
.fcard .moon{top:22px;width:30px;height:30px;margin-left:-15px;box-shadow:7px -4px 0 0 var(--glow)}
.fcard h3{margin:0 0 16px;text-align:center;font:600 11px/1 var(--f-body);letter-spacing:.24em;text-transform:uppercase;color:var(--glow)}
.ln{padding:11px 0}
.ln+.ln{border-top:1px solid rgba(242,211,146,.18)}
.ln small{display:block;font:500 11.5px/1.2 var(--f-body);letter-spacing:.12em;text-transform:uppercase;color:rgba(242,211,146,.7);margin-bottom:5px}
.ln div{font:italic 500 23px/1.22 var(--f-display);color:#FBEFD6;overflow-wrap:anywhere}
.fcard .sig{margin:14px 0 0;text-align:center;font-size:12.5px;color:rgba(246,234,211,.55)}

/* ---------- РЕЗУЛЬТАТ ---------- */
.res-top{padding-block:30px 40px}
.eyebrow{font:600 11px/1 var(--f-body);letter-spacing:.2em;text-transform:uppercase;color:var(--gold-ink);margin:0 0 10px}
.night .eyebrow{color:rgba(242,211,146,.8);text-align:center}
.cardbtns{display:grid;gap:10px;margin:26px auto 0;max-width:440px}
.cardbtns .row2 .btn{font-size:15px;min-height:50px;padding-inline:12px}
.name{text-align:center;margin:34px 0 0}
.name p.k{margin:0 0 6px;font-size:14px;color:rgba(246,234,211,.6)}
.name h2{margin:0;font:500 clamp(34px,9vw,44px)/1.05 var(--f-display);color:#FBEFD6;text-wrap:balance}
.name .ess{margin:14px auto 0;max-width:30em;color:rgba(246,234,211,.85);font-size:17px;text-wrap:pretty}
.strong{margin:22px auto 0;max-width:440px;padding:16px 18px;border-radius:16px;background:rgba(242,211,146,.08);border:1px solid rgba(242,211,146,.25);color:rgba(246,234,211,.9);font-size:16px}
.strong b{display:block;font:600 11px/1 var(--f-body);letter-spacing:.18em;text-transform:uppercase;color:var(--glow);margin-bottom:7px}
.ktnote{margin:16px auto 0;max-width:440px;font-size:15px;color:rgba(246,234,211,.75);border-left:2px solid rgba(242,211,146,.5);padding-left:12px}

.rec{margin:30px auto 0;max-width:440px}
.rec h3{font:500 28px/1.15 var(--f-display);margin:0 0 6px;text-align:center}
.rec .sub{margin:0 0 14px;text-align:center;font-size:15px;color:var(--muted)}
.night .rec h3{color:#FBEFD6}
.night .rec .opts .opt{background:rgba(251,246,239,.06);border-color:rgba(242,211,146,.3);color:var(--cream);min-height:52px}
.night .rec .opts .opt .mk{border-color:rgba(242,211,146,.5)}
.night .rec .opts .opt[aria-pressed="true"]{background:rgba(242,211,146,.18);border-color:var(--glow)}
.night .rec .opts .opt[aria-pressed="true"] .mk{background:var(--glow);border-color:var(--glow)}
.night .rec .opts .opt[aria-pressed="true"] .mk::after{border-color:#2A1D16}
.rec-wait{text-align:center;margin:12px 0 0;font-size:14px;color:rgba(246,234,211,.55)}

.sec{padding-block:30px 6px}
.sec h3{display:flex;align-items:center;gap:12px;font:500 clamp(26px,7vw,30px)/1.12 var(--f-display);margin:0 0 14px;text-wrap:balance}
.sec h3::before{content:"";flex:none;width:12px;height:17px;border:1.5px solid var(--gold);border-bottom:0;border-radius:6px 6px 0 0}
.sec p{margin:0 0 12px;text-wrap:pretty}
.sec .quote{font:italic 500 21px/1.3 var(--f-display);color:var(--terra)}
.lead-in{font-size:16px;color:var(--muted);font-style:italic}
.daily{list-style:none;padding:0;margin:8px 0 0;display:grid;gap:10px}
.daily li{position:relative;padding:12px 14px 12px 38px;background:rgba(251,246,239,.75);border-radius:14px;border:1px solid var(--clay);font-size:16px}
.daily li::before{content:"";position:absolute;left:15px;top:19px;width:8px;height:8px;border-radius:50%;background:var(--gold)}

.chain{list-style:none;padding:0;margin:6px 0 0;position:relative}
.chain::before{content:"";position:absolute;left:7px;top:10px;bottom:16px;width:1px;background:linear-gradient(var(--gold),rgba(201,161,92,.2))}
.chain li{position:relative;padding:0 0 14px 30px}
.chain li::before{content:"";position:absolute;left:2px;top:7px;width:11px;height:11px;border-radius:50%;background:var(--sand);border:1.5px solid var(--gold)}
.chain li:last-child::before{background:var(--terra);border-color:var(--terra)}
.chain small{display:block;font:600 11px/1.3 var(--f-body);letter-spacing:.14em;text-transform:uppercase;color:var(--gold-ink)}
.chain span{font-size:16.5px}
.fact{margin:6px 0 0;padding:16px 18px;border-radius:16px;background:var(--ink);color:var(--cream);font-size:16px}
.fact b{color:var(--glow);font-weight:500}
.feel{margin:14px 0 0;padding:14px 16px;border-radius:14px;background:rgba(111,125,92,.12);color:#3D4730;font-size:16px}

details.fold{margin:12px 0 0;border:1px solid var(--clay);border-radius:16px;background:rgba(251,246,239,.75)}
details.fold summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:12px;min-height:56px;padding:12px 16px;font:500 21px/1.2 var(--f-display)}
details.fold summary::-webkit-details-marker{display:none}
details.fold summary::after{content:"";margin-left:auto;flex:none;width:9px;height:9px;border-right:1.5px solid var(--gold-ink);border-bottom:1.5px solid var(--gold-ink);transform:rotate(45deg) translateY(-3px);transition:transform .25s}
details.fold[open] summary::after{transform:rotate(-135deg)}
details.fold .in{padding:0 16px 14px}
details.fold .in p{font-size:16px}
.voices{display:grid;gap:8px;margin:4px 0 12px}
.voices span{font:italic 500 21px/1.25 var(--f-display);color:var(--terra)}

.kid .opts{margin-top:10px}
.kid .opt{font-size:16px;min-height:52px}
.kid-res{margin-top:14px;padding:16px 18px;border-radius:16px;background:var(--linen);border:1px solid var(--clay)}
.kid-res .dec{font:italic 500 22px/1.25 var(--f-display);color:var(--terra);display:block;margin:4px 0 10px}
.small{font-size:13.5px;color:var(--muted)}

.pairs{display:grid;gap:12px}
.pair{padding:16px 18px;border-radius:16px;background:var(--linen);border:1px solid var(--clay)}
.pair .sit{font:600 11px/1.3 var(--f-body);letter-spacing:.14em;text-transform:uppercase;color:var(--gold-ink);margin-bottom:8px}
.pair .now{color:var(--muted);font-size:15.5px;margin:0 0 8px}
.pair .now::before{content:"Сейчас: ";font-weight:600}
.pair .may{margin:0;font-size:16.5px;padding-left:14px;border-left:2px solid var(--olive)}
.pair .may::before{content:"Может быть так: ";font-weight:600;color:var(--olive)}

/* двери */
.doors{display:grid;gap:16px;margin-top:6px}
.door{position:relative;padding:24px 20px 20px;border-radius:22px;background:var(--linen);border:1px solid var(--clay)}
.door.main{border-radius:170px 170px 22px 22px/90px 90px 22px 22px;padding-top:46px;background:linear-gradient(180deg,#FFF9F1,var(--linen));box-shadow:0 0 0 1px var(--gold) inset,0 20px 40px -24px rgba(90,60,30,.35)}
.door .tag{position:absolute;top:16px;left:50%;transform:translateX(-50%);font:600 10.5px/1 var(--f-body);letter-spacing:.16em;text-transform:uppercase;color:var(--gold-ink);white-space:nowrap}
.door h4{margin:0 0 4px;font:500 30px/1.05 var(--f-display);text-align:left}
.door.main h4{text-align:center}
.door .meta{margin:0 0 12px;font-size:14px;color:var(--muted)}
.door.main .meta{text-align:center}
.door p{font-size:16px}
.resbox{margin:14px 0;padding:14px 16px;border-radius:14px;background:rgba(111,125,92,.12)}
.resbox b{display:block;font:600 11px/1 var(--f-body);letter-spacing:.18em;text-transform:uppercase;color:var(--olive);margin-bottom:8px}
.resbox p{margin:0 0 8px;color:#323A27}
.resbox i{display:block;font-size:14px;color:var(--muted)}
.bridge{font-size:15px;color:var(--muted);font-style:italic}
.code{margin:22px 0 0;padding:20px;border-radius:20px;background:var(--ink);color:var(--cream);text-align:center}
.code p{margin:0 0 10px;font-size:15px;color:rgba(246,234,211,.75)}
.code .cw{display:block;text-wrap:balance;font:600 19px/1.3 var(--f-body);letter-spacing:.06em;color:var(--glow);margin:0 0 16px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.code .small{color:rgba(246,234,211,.55);margin:12px 0 0}
.later{text-align:center;color:var(--muted);font-size:15px;margin:16px 0 0}
.links{display:grid;gap:10px;margin:26px 0 0}
.links .btn{min-height:52px;font-size:16px;font-weight:500}
.disc{margin:30px 0 0;padding:18px 0 40px;border-top:1px solid var(--clay);font-size:13px;color:var(--muted)}
.disc p{margin:0 0 8px}
.support{margin:0 0 20px;padding:18px;border-radius:18px;background:#FFF;border:1px solid var(--clay)}
.support h3{margin:0 0 8px;font:500 24px/1.2 var(--f-display)}

/* шторка */
.sheet{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center;background:rgba(18,14,25,.55);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);animation:fade .25s both}
.sheet .pan{width:100%;max-width:560px;max-height:92dvh;overflow:auto;background:var(--sand);border-radius:26px 26px 0 0;padding:22px 20px calc(22px + env(safe-area-inset-bottom,0px));animation:up .35s var(--ease) both}
.sheet .grab{width:42px;height:4px;border-radius:4px;background:#D2C0AA;margin:-8px auto 16px}
.sheet h3{margin:0 0 10px;font:500 27px/1.12 var(--f-display);text-wrap:balance}
.sheet p{margin:0 0 12px}
.sheet textarea{width:100%;min-height:150px;padding:12px 14px;border-radius:14px;border:1px solid var(--clay);background:#fff;font:400 15px/1.45 var(--f-body);resize:vertical}
.sheet .ok{display:flex;align-items:center;gap:8px;font-weight:600;color:var(--olive);margin:12px 0}
.sheet .ok::before{content:"";width:18px;height:18px;border-radius:50%;background:var(--olive);-webkit-mask:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 18 18'><path d='M4 9.5l3 3 7-7' stroke='black' stroke-width='2.2' fill='none'/></svg>") center/14px no-repeat,linear-gradient(#000,#000);-webkit-mask-composite:xor;mask-composite:exclude}
.sheet .stack{display:grid;gap:10px;margin-top:14px}
.sheet img{display:block;width:100%;max-width:320px;margin:0 auto 14px;border-radius:14px;box-shadow:0 20px 40px -16px rgba(0,0,0,.4)}
.numbers{margin:10px 0 0;padding:0;list-style:none;display:grid;gap:6px}
.numbers li{padding:10px 12px;border-radius:12px;background:var(--linen);font-size:15px}
.numbers b{font-weight:600}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--cream);padding:12px 18px;border-radius:999px;font-size:15px;box-shadow:0 10px 30px -10px rgba(0,0,0,.5);animation:up .3s var(--ease) both;max-width:calc(100% - 32px);text-align:center}

@media (min-width:700px){
  .cover{justify-content:center}
  .qbody{padding-top:22px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}
}

.rec.day{margin:30px 0 0;max-width:none;padding:22px 18px 18px;border-radius:22px;background:var(--linen);border:1px solid var(--gold)}
.toc{margin:30px auto 0;max-width:440px;padding:20px 20px 22px;border-radius:20px;background:rgba(242,211,146,.07);border:1px solid rgba(242,211,146,.3)}
.toc b{display:block;font:500 25px/1.15 var(--f-display);color:#FBEFD6;text-align:center;margin:0 0 4px}
.toc>p{margin:0 0 14px;text-align:center;font-size:15px;color:rgba(246,234,211,.7)}
.toc ol{list-style:none;counter-reset:t;margin:0 0 18px;padding:0;display:grid;gap:8px}
.toc li{counter-increment:t;display:flex;gap:12px;align-items:baseline;font-size:16px;color:rgba(246,234,211,.9)}
.toc li::before{content:counter(t);flex:none;width:24px;font:italic 500 20px/1 var(--f-display);color:var(--glow)}
.btn .arr{display:inline-block;animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(4px)}}
.door .price{display:block;font:500 34px/1 var(--f-display);color:var(--terra);margin:2px 0 6px}
.door.main .price{text-align:center}
.door .what{margin:0 0 12px;padding:12px 14px;border-radius:14px;background:rgba(201,161,92,.1);font-size:15.5px}
.door .what b{display:block;font:600 11px/1 var(--f-body);letter-spacing:.16em;text-transform:uppercase;color:var(--gold-ink);margin-bottom:6px}
.doors-intro{margin:0 0 14px;color:var(--muted)}
.steps{margin:14px 0 6px;padding-left:22px;display:grid;gap:6px;font-size:15.5px}
.sheet .btn-line{display:block;margin:4px auto 0}
.opts.grid2{grid-template-columns:1fr 1fr;gap:8px}
.opts.grid2 .opt{min-height:64px;padding:10px 12px;font-size:15px;line-height:1.25;align-items:flex-start}
.opts.grid2 .opt .mk{width:18px;height:18px;margin-top:1px}
.midcta{margin:16px 0 0;padding:16px 18px;border-radius:16px;border:1px dashed var(--gold);background:rgba(251,246,239,.7)}
.midcta p{font-size:16px}
.midcta .small{margin:10px 0 0;text-align:center}
.sharecard{margin:16px 0 0;padding:18px;border-radius:20px;background:linear-gradient(160deg,#FFF7EC,#F6E6D3);border:1px solid var(--clay)}
.sharecard b{display:block;font:500 24px/1.15 var(--f-display);margin-bottom:6px}
.sharecard p{font-size:15.5px;color:var(--muted);margin:0 0 12px}
.sharecard .btn{min-height:52px;font-size:15.5px;padding-inline:10px}
.toc li a{color:inherit;text-decoration:underline;text-decoration-color:rgba(242,211,146,.35);text-underline-offset:4px}
.altbox{margin:6px 0 14px;padding:18px;border-radius:20px;background:var(--linen);border:1px solid var(--gold)}
.altbox small{display:block;font:600 11px/1 var(--f-body);letter-spacing:.16em;text-transform:uppercase;color:var(--gold-ink);margin-bottom:8px}
.altbox b{display:block;font:500 28px/1.1 var(--f-display);margin-bottom:8px}
.altbox p{font-size:16px}
.trust .trust2{margin-top:10px;font-size:14px;color:rgba(246,234,211,.62)}
.ava{width:34px;height:34px;border-radius:50%;object-fit:cover;box-shadow:0 0 0 1px rgba(242,211,146,.7),0 0 0 3px rgba(18,14,25,.6);flex:none}
.ava.big{width:52px;height:52px;box-shadow:0 0 0 1.5px var(--gold)}
.dmhead{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.dmhead h3{margin:0}
.about{margin:0 0 20px;border-radius:22px;overflow:hidden;background:var(--linen);border:1px solid var(--clay)}
.about-ph{display:block;width:100%;height:auto;aspect-ratio:4/5;object-fit:cover;max-width:100%}
.about-tx{padding:18px 18px 6px}
.about-tx small{display:block;font:600 11px/1 var(--f-body);letter-spacing:.18em;text-transform:uppercase;color:var(--gold-ink);margin-bottom:10px}
.about-tx p{font-size:16px}
.about-tx p:last-child{font:italic 500 20px/1.35 var(--f-display);color:var(--ink)}
@media (min-width:520px){.about{display:grid;grid-template-columns:200px 1fr}.about-ph{height:100%;aspect-ratio:auto}}
.reviews{margin:0 0 22px;display:grid;gap:10px}
.reviews>small{font:600 11px/1 var(--f-body);letter-spacing:.18em;text-transform:uppercase;color:var(--gold-ink);margin-bottom:2px}
.reviews blockquote,.door blockquote.tq{margin:0;padding:14px 16px 14px 18px;border-left:2px solid var(--gold);background:rgba(251,246,239,.8);border-radius:0 14px 14px 0;font:italic 500 19px/1.35 var(--f-display);color:var(--ink)}
.door blockquote.tq{margin:0 0 14px;font-size:18px}
.reviews .small{margin:0}
.reviews blockquote mark,.door blockquote mark{background:linear-gradient(transparent 52%,rgba(232,178,120,.55) 52%,rgba(232,178,120,.55) 92%,transparent 92%);color:inherit;font-style:italic;font-weight:600;padding:0 1px}
.shots{margin-top:4px}
.shots>small{display:block;font:600 11px/1 var(--f-body);letter-spacing:.16em;text-transform:uppercase;color:var(--gold-ink);margin:6px 0 8px}
.strip{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch}
.shot{flex:none;width:118px;height:170px;padding:0;border:1px solid var(--clay);border-radius:12px;overflow:hidden;background:#111;scroll-snap-align:start}
.shot img{width:100%;height:100%;object-fit:cover;object-position:top}
.door .shots{margin:0 0 14px}
.shotview{display:grid;gap:12px}
.shotview img{width:100%;max-width:100%;border-radius:12px;margin:0;box-shadow:none}
.energy{margin-top:18px;padding:18px;border-radius:20px;background:var(--linen);border:1px solid var(--clay)}
.energy>b{display:block;font:500 24px/1.15 var(--f-display);margin-bottom:6px}
.energy blockquote{margin:0 0 6px;padding:12px 14px;border-left:2px solid var(--gold);background:rgba(242,232,220,.6);border-radius:0 12px 12px 0;font:italic 500 18px/1.35 var(--f-display)}
.energy blockquote mark{background:linear-gradient(transparent 52%,rgba(232,178,120,.55) 52%,rgba(232,178,120,.55) 92%,transparent 92%);color:inherit;font-weight:600}
.energy .shots{margin:8px 0 12px}
.reviews>*,.shots,.strip{min-width:0;max-width:100%}
.doors>*,.door>*,.energy>*{min-width:0}
.bs{display:grid;gap:8px}
.bsrow{padding:14px 16px;border-radius:16px}
.bsrow small{display:block;font:600 11px/1 var(--f-body);letter-spacing:.16em;text-transform:uppercase;margin-bottom:6px}
.bsrow p{margin:0;font:italic 500 21px/1.3 var(--f-display)}
.bsrow.was{background:rgba(42,32,48,.06);color:var(--muted)}
.bsrow.was small{color:var(--muted)}
.bsrow.will{background:rgba(111,125,92,.14);color:#2F3A24}
.bsrow.will small{color:var(--olive)}
.door-mini{margin-top:14px;padding:18px;border-radius:20px;background:var(--linen);border:1px solid var(--clay)}
.door-mini>b{display:block;font:500 23px/1.15 var(--f-display);margin-bottom:6px}
.door-mini p{font-size:16px}
.door-mini blockquote.tq{margin:0 0 12px;padding:12px 14px;border-left:2px solid var(--gold);background:rgba(242,232,220,.6);border-radius:0 12px 12px 0;font:italic 500 18px/1.35 var(--f-display)}
.door-mini blockquote mark{background:linear-gradient(transparent 52%,rgba(232,178,120,.55) 52%,rgba(232,178,120,.55) 92%,transparent 92%);color:inherit;font-weight:600}
.door-mini>*,.door-mini .shots{min-width:0;max-width:100%}
.door-mini .shots{margin:0 0 12px}
.door.save{margin-bottom:14px}
#r-may .bs{margin:0 0 12px}
.sbar{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;align-items:center;gap:10px;padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));
  background:rgba(26,20,34,.94);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);box-shadow:0 -1px 0 rgba(242,211,146,.35),0 -12px 30px -12px rgba(0,0,0,.4);
  transform:translateY(110%);transition:transform .35s var(--ease)}
.sbar.on{transform:none}
.sbar-tx{flex:1;min-width:0;text-align:left;background:none;border:0;padding:4px 2px;color:var(--cream)}
.sbar-tx b{display:block;font:500 20px/1.1 var(--f-display);color:#FBEFD6}
.sbar-tx span{display:block;font-size:12.5px;color:rgba(246,234,211,.65);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sbar-btn{width:auto;min-height:48px;padding:10px 20px;font-size:16px;flex:none}
@media (min-width:600px){.sbar{left:50%;right:auto;width:560px;transform:translate(-50%,110%);border-radius:18px 18px 0 0}.sbar.on{transform:translate(-50%,0)}}
.disc{padding-bottom:110px}

/* ===== дизайн-правки 06.10 ===== */
/* 1. обложка: кнопка в первом экране */
.arch{width:min(72vw,300px,calc(44svh*.75))}
.cover{padding-block:20px 32px}
.author{margin-bottom:16px}
.lead{font-size:17px;margin:14px 0 18px}
.reflect{height:28px}
/* 2. название круга — главный момент */
.res-top .name{margin:8px 0 0}
.name h2{font-size:clamp(40px,11vw,52px);text-shadow:0 0 28px rgba(242,211,146,.35)}
.name h2::after{content:"";display:block;width:64px;height:1px;margin:18px auto 0;background:linear-gradient(90deg,transparent,var(--glow),transparent)}
.name .ess{max-width:32ch}
.res-top .fcard{margin-top:30px}
.res-top .fcard .sig{display:none}
/* 3. блок нейросессии */
.door.main{overflow:visible;padding:58px 22px 22px;background:radial-gradient(80% 30% at 50% 0,rgba(242,211,146,.28),transparent 70%),linear-gradient(180deg,#FFF9F1,var(--linen))}
.door .tag{top:-11px;padding:6px 12px;border-radius:999px;background:var(--sand);box-shadow:0 0 0 1px var(--gold) inset}
.door.main h4{font-size:34px}
.door.main .price{font-size:44px;margin:6px 0 4px}
.door.main .price::before,.door.main .price::after{content:"";display:inline-block;vertical-align:middle;width:28px;height:1px;margin:0 12px;background:var(--gold)}
.door.main>p{font-size:15.5px;line-height:1.6}
/* 4. дневной фон: штукатурка и закат */
.day-bg{background:
  radial-gradient(120% 60% at 50% -10%,#FFF8EE 0%,rgba(255,248,238,0) 60%),
  radial-gradient(110% 45% at 50% 115%,rgba(236,170,120,.32),rgba(236,170,120,0) 70%),
  radial-gradient(70% 40% at 0% 60%,rgba(214,188,160,.25),transparent 70%),
  var(--sand)}
.day-bg::before{width:min(520px,118vw);height:460px;opacity:.6;-webkit-mask:linear-gradient(#000 40%,transparent);mask:linear-gradient(#000 40%,transparent)}
.day-bg::after{opacity:.55;background-image:
  url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='600' height='600'><filter id='c'><feTurbulence type='fractalNoise' baseFrequency='.012' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .55  0 0 0 0 .45  0 0 0 0 .38  0 0 0 .10 0'/></filter><rect width='600' height='600' filter='url(%23c)'/></svg>"),
  url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .55  0 0 0 0 .45  0 0 0 0 .38  0 0 0 .22 0'/></filter><rect width='160' height='160' filter='url(%23n)'/></svg>");
  background-size:600px,160px}
/* 5. варианты ответов с глубиной и откликом */
.opt{background:linear-gradient(180deg,#FFFBF6,var(--linen));border-color:rgba(214,196,172,.9);box-shadow:0 1px 0 #fff inset,0 6px 16px -12px rgba(90,60,30,.35)}
.opt[aria-pressed="true"]{background:linear-gradient(180deg,#F6E2D0,var(--peach));box-shadow:0 0 0 1px var(--gold) inset,0 10px 24px -14px rgba(185,138,66,.6)}
.opt[aria-pressed="true"] .mk{animation:pop .28s var(--ease)}
@keyframes pop{0%{transform:scale(.6)}70%{transform:scale(1.12)}}
.opt.own,.scene-pin,.midcta{border-style:solid}
.scene-pin{border-color:rgba(201,161,92,.35);background:linear-gradient(90deg,rgba(242,211,146,.18),rgba(251,246,239,.6))}
.midcta{border-color:rgba(201,161,92,.55)}
/* 6. главные тёмные кнопки */
.btn-ink{background:linear-gradient(180deg,#3A2B41,#231A29);box-shadow:0 0 0 1px rgba(201,161,92,.55) inset,0 1px 0 rgba(255,236,190,.15) inset,0 14px 28px -14px rgba(42,32,48,.7);letter-spacing:.01em}
.door.main .btn-ink{color:var(--glow)}
/* 7. сетка экрана 5 */
.opts.grid2 .opt{align-items:center;min-height:56px;padding:12px 12px 12px 14px}
.opts.grid2 .opt .mk{margin-top:0}
.opts.grid2 .opt:last-child:nth-child(odd){grid-column:1/-1}
/* 8. значок у заголовков */
.sec h3{align-items:flex-start}
.sec h3::before{width:14px;height:20px;margin-top:.22em;border-width:1.5px;background:linear-gradient(rgba(242,211,146,.35),transparent)}
/* 9. оглавление */
.toc ol{gap:0}
.toc li{padding:11px 0;border-top:1px solid rgba(242,211,146,.15)}
.toc li a{text-decoration:none;flex:1;display:flex;justify-content:space-between;gap:10px}
.toc li a::after{content:"↓";color:var(--glow);opacity:.6}
/* 10. отзывы спокойнее */
.reviews blockquote mark,.door blockquote mark,.door-mini blockquote mark{font-weight:500;background:linear-gradient(transparent 62%,rgba(232,178,120,.38) 62%,rgba(232,178,120,.38) 90%,transparent 90%)}
.reviews blockquote{background:linear-gradient(90deg,rgba(242,211,146,.14),rgba(251,246,239,.8) 40%)}
/* 12. прогресс заметнее */
.prog{height:4px}
/* баги */
.sec .feel{margin-top:10px}
.sharecard .row2{grid-template-columns:1fr}
.about-ph{background:linear-gradient(160deg,#EAD9C6,#D9C2A8)}
.shot{background:linear-gradient(160deg,#EFE3D4,#E2CFBA)}
.later{margin-top:20px}
.links{margin-top:16px}
.sec p + details.fold{margin-top:16px}
.sheet textarea{resize:none;min-height:132px;background:linear-gradient(#fff,#FFFBF6)}
.scene-pin{font-size:19px;color:var(--ink)}
.scene-pin span{padding-top:4px}
/* заголовки разделов: вместо значка-арки тонкая золотая черта сверху */
.sec h3{display:block}
.sec h3::before{content:"";display:block;width:32px;height:1.5px;margin:0 0 14px;border:0;border-radius:2px;background:linear-gradient(90deg,var(--gold),rgba(201,161,92,.2))}
/* гладь воды под аркой: горизонт, лунная дорожка, мерцание */
.reflect{position:relative;height:64px;width:min(92vw,400px);margin:0 auto;opacity:1;overflow:hidden;
  background:linear-gradient(180deg,rgba(242,211,146,.10),rgba(242,211,146,0) 85%);
  -webkit-mask:radial-gradient(60% 100% at 50% 0,#000 0,#000 35%,transparent 80%);mask:radial-gradient(60% 100% at 50% 0,#000 0,#000 35%,transparent 80%)}
.reflect::before{content:"";position:absolute;inset:0;
  background:repeating-linear-gradient(180deg,rgba(242,211,146,.55) 0 1px,transparent 1px 6px);
  -webkit-mask:linear-gradient(90deg,transparent,#000 30%,#000 70%,transparent);mask:linear-gradient(90deg,transparent,#000 30%,#000 70%,transparent);
  animation:ripple 5s ease-in-out infinite}
.reflect::after{content:"";position:absolute;left:50%;top:0;width:70px;height:100%;transform:translateX(-50%);
  background:repeating-linear-gradient(180deg,rgba(255,226,160,.95) 0 2px,transparent 2px 5px);
  -webkit-mask:linear-gradient(180deg,#000,transparent);mask:linear-gradient(180deg,#000,transparent);filter:blur(.4px);
  animation:shimmer 3.2s ease-in-out infinite}
@keyframes ripple{50%{transform:translateY(2px);opacity:.75}}
@keyframes shimmer{0%,100%{opacity:.85;width:70px}50%{opacity:.5;width:46px}}
.pnum{flex:none;font:500 13px/1 var(--f-body);color:var(--gold-ink);font-variant-numeric:tabular-nums;letter-spacing:.06em}
/* формула ближе к концу разбора, тёмной полосой во всю ширину */
.fband{margin:34px calc(50% - 50vw) 0;width:100vw;padding-block:34px 36px}
.fband .fb-h{margin:0 0 4px;text-align:center;font:500 30px/1.15 var(--f-display);color:#FBEFD6}
.fband .fcard{margin-top:22px}
.fband .fcard .sig{display:none}
/* v12: тёплый закат у горизонта внутри арки и луна чуть крупнее */
.arch::before{background:radial-gradient(70% 55% at 50% 20%, rgba(242,211,146,.28), rgba(242,211,146,0) 70%),
  radial-gradient(95% 42% at 50% 100%, rgba(226,146,92,.34), rgba(226,146,92,0) 72%),
  linear-gradient(180deg,rgba(242,211,146,.08),rgba(242,211,146,0) 60%)}
.arch > .moon{top:14%;width:54px;height:54px;margin-left:-27px;box-shadow:12px -7px 0 0 var(--glow)}
/* v12: блок «Почему всё идёт по кругу» читается поверх золотого заката */
.trust{background:rgba(14,11,20,.62);border:1px solid rgba(242,211,146,.25);border-radius:20px;padding:20px 18px 18px;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.trust p{color:rgba(246,234,211,.92)}
.trust .trust2{color:rgba(246,234,211,.8)}
.cover .fine{color:rgba(246,234,211,.78);text-shadow:0 1px 6px rgba(14,11,20,.6)}
/* v12: луна снаружи арки, справа сверху, чтобы не закрывала заголовок */
.arch > .moon{top:-6px;left:auto;right:-30px;margin-left:0;width:48px;height:48px;box-shadow:11px -6px 0 0 var(--glow)}
@media (max-height:700px){.arch{padding:0 14px 22px}.arch h1{font-size:31px}}
/* v12: заголовок по центру арки */
.arch{justify-content:center;padding-bottom:12px}
.name .ess.hope{margin-top:10px;color:rgba(242,211,146,.92);font-style:italic}
.wline{align-items:center}.wclr{flex:none;width:34px;height:34px;border-radius:50%;border:1px solid #D9C7B1;background:rgba(255,255,255,.6);color:var(--gold-ink);font:400 20px/1 var(--f-body,inherit);cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
.words{grid-template-columns:minmax(0,1fr)}.wline{min-width:0}.wline input{width:0}
.wclr[hidden]{display:none}
/* v12: заметная главная кнопка на обложке */
@keyframes ctaPulse{0%,100%{transform:scale(1);box-shadow:0 10px 30px rgba(242,211,146,.25),0 0 0 0 rgba(242,211,146,.55)}50%{transform:scale(1.03);box-shadow:0 12px 36px rgba(242,211,146,.4),0 0 0 12px rgba(242,211,146,0)}}
.cover .btn-gold{animation:ctaPulse 2.2s ease-in-out infinite;font-size:18px;min-height:60px}
@media (prefers-reduced-motion:reduce){.cover .btn-gold{animation:none}}
.cover-cta{position:fixed;left:0;right:0;bottom:0;z-index:40;padding:12px 16px calc(14px + env(safe-area-inset-bottom,0px));background:linear-gradient(180deg,rgba(14,11,20,0),rgba(14,11,20,.92) 40%);transition:opacity .3s,transform .3s}
.cover-cta .btn{width:100%;max-width:440px;margin:0 auto;display:flex;justify-content:center;animation:ctaPulse 2.2s ease-in-out infinite}
.cover-cta.off{opacity:0;transform:translateY(20px);pointer-events:none}
@media (prefers-reduced-motion:reduce){.cover-cta .btn{animation:none}}
/* v13: кнопка «Дальше» всегда видна, группы в 1-м вопросе, тач без залипания hover */
.qfoot{position:sticky;bottom:0;z-index:5;margin-top:18px;padding:14px 0 calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(180deg,rgba(244,236,225,0),rgba(244,236,225,.96) 30%)}
.opts .grp{margin:14px 2px 2px;font:600 11.5px/1.4 var(--f-body);letter-spacing:.14em;text-transform:uppercase;color:var(--gold-ink)}
.opts .grp:first-child{margin-top:0}
.opt:hover{border-color:inherit}
@media (hover:hover){.opt:hover{border-color:#D3B98E}}
.res-top .tired{display:block;margin:14px auto 0;max-width:320px;text-align:center;color:rgba(246,234,211,.8);font-size:14.5px;line-height:1.4}
.fine,.disc p{font-size:14px}

/* 07.10: вода под аркой (золото льётся) и пульсация нижней кнопки «Записаться» */
.cover .water{display:block;width:min(92vw,400px);max-width:100%;height:auto;margin:0 auto;overflow:visible}
.sbar-btn{animation:ctaPulse 2.2s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.sbar-btn{animation:none}}
</style>

  // Блок «Кто я» перед записью. Строки с цифрами добавь, когда посчитаешь (пусто = не показывается).
  about: [
    "Я Мария, нейрокоуч и таролог. Живу в Дубае, работаю онлайн. Пять лет ко мне приходят женщины из разных стран с одним и тем же: «я всё понимаю, а сделать с собой ничего не могу».",
    "Он не отвечает несколько часов, и ты снова проверяешь телефон. Муж сказал что-то обидное, и ты несколько дней ходишь убитая. Мама бросила «ну что ты опять», и тебе как будто снова 15, хотя тебе давно не 15.",
    "Понять, откуда это, можно и самой. А вот поменять саму реакцию в одиночку сложно, с этим ко мне и приходят.",
    "Мы созваниваемся по видео, и ты рассказываешь про один момент, который тебя выбивает. Я помогаю тебе снова в нём оказаться: что ты видишь, что говоришь себе, где это отзывается в теле. Часто мы выходим на более раннюю ситуацию, где похожее чувство уже было, и смотрим, что ты тогда решила про себя. Например, «меня всё равно оставят» или «надо быть удобной, иначе не будут любить». На сессии мы работаем именно с этой реакцией и тем, что за ней стоит, без гипноза. А в конце возвращаемся к ситуации, с которой начали, и смотрим, что изменилось.",
    "Не нужно заранее знать, что говорить. Бывает, человек замолкает или говорит «ничего не приходит», а я в этот момент вижу и чувствую, что пришло, но страшно об этом сказать. И помогаю дойти туда, куда самой было бы сложно.",
    "После этого то, что раньше выбивало тебя на несколько дней, может уже не иметь над тобой такой власти: расстроилась, выдохнула, а вечером занимаешься своими делами. А дальше изменения у каждой свои. Кто-то перестаёт держаться за отношения, в которых давно плохо. Кто-то впервые не бежит мириться после ссоры. Кто-то замечает, что иначе чувствует себя рядом с мужчинами."
  ],

  // Отзывы (без имён). Можно менять текст в кавычках. **слова в двойных звёздочках** выделяются маркером.
  reviews: {
    nejro: [
      "Раньше я бы **дня три ходила убитая**. А тут возникла проблема с мужем: **села, нашла выход и забыла**. И только потом поняла, насколько по-другому отреагировала.",
      "**Понимать головой и реально отпустить**, оказывается, вообще разные вещи. И ещё начала чувствовать, что **муж ценит меня именно как женщину**, как жену. Раньше я этого вообще не чувствовала.",
      "Я как будто **видимой какой-то стала**. **Мужчины смотрят, поглядывают**, я аж застеснялась от такого количества внимания. Я всю жизнь всех всегда прощала, а тут меня очень сильно обидел друг. Раньше я бы сразу простила, а сейчас просто сразу **отодвинула его в сторону** и сама офигела от себя.",
      "После сессии появилось ощущение лёгкости, как будто **жизнь разделилась на «до» и «после»**. И внутри появилось чувство, что **я имею право жить свою прекрасную жизнь**."
    ],
    tarotHe: "После твоего расклада у меня как будто **пазл сложился**: ты так чётко объяснила, **что у него в голове и почему он так делает**. Появилась **уверенность, а не эта вечная паника**.",
    tarotAlone: "Настолько хотела семью и замуж, что не заметила, что ему это совсем не нужно. Неприятно, конечно, но **лучше сейчас, чем потратила бы ещё несколько лет**. **Настолько точно и подробно** мне никто никогда не делал расклады."
  },

        x.fillStyle = "#F2D392"; x.font = '600 28px "Onest", sans-serif'; spaced(x, "МОЯ СИЛЬНАЯ СТОРОНА", W / 2, y, 6); y += 84;
        x.fillStyle = "#FBEFD6"; x.font = 'italic 500 60px "Cormorant Garamond", Georgia, serif';
        wrapText(x, sc.strengthMe || sc.strength, 720).slice(0, 4).forEach(function (t) { x.fillText(t, W / 2, y); y += 70; });
      } else {
        y += 60; x.fillStyle = "#FBEFD6"; x.font = 'italic 500 56px "Cormorant Garamond", Georgia, serif';
        wrapText(x, "Моя формула собрана из моих слов", 720).forEach(function (t) { x.fillText(t, W / 2, y); y += 66; });
      }
    }
    // призыв: выше строки ответа в сторис
    x.fillStyle = "#FBEFD6"; x.font = 'italic 500 52px "Cormorant Garamond", Georgia, serif';
    x.fillText("А по какому кругу ходит твоя любовь?", W / 2, 1520);
    x.strokeStyle = "rgba(242,211,146,.6)"; x.lineWidth = 2; x.beginPath();
    if (x.roundRect) x.roundRect(W / 2 - 330, 1548, 660, 72, 36); else x.rect(W / 2 - 330, 1548, 660, 72); x.stroke();
    x.fillStyle = "rgba(246,234,211,.95)"; x.font = '500 34px "Onest", sans-serif';
    x.fillText("Напиши «ФОРМУЛА» в директ", W / 2, 1596);
    if (C.instagram) { x.fillStyle = "#F2D392"; x.font = '500 34px "Onest", sans-serif'; x.fillText("@" + C.instagram.replace(/^@/, ""), W / 2, 1672); }
    return c.toDataURL("image/jpeg", .92);
  }
  function spaced(x, t, cx, y, sp) {
    var w = 0, i; for (i = 0; i < t.length; i++) w += x.measureText(t[i]).width + sp; w -= sp;
    var px = cx - w / 2; x.textAlign = "left"; for (i = 0; i < t.length; i++) { x.fillText(t[i], px, y); px += x.measureText(t[i]).width + sp; } x.textAlign = "center";
  }

  /* ---------- золотая пыль ---------- */
  function dust(band) {
    var c = h("canvas", { class: "dust", "aria-hidden": "true" }); band.insertBefore(c, band.firstChild);
    var x = c.getContext("2d"), P = [], run = true, dpr = Math.min(2, window.devicePixelRatio || 1), W, H;
    var rm = matchMedia("(prefers-reduced-motion: reduce)").matches;
    function size() { W = band.clientWidth; H = band.clientHeight; c.width = W * dpr; c.height = H * dpr; x.setTransform(dpr, 0, 0, dpr, 0, 0); }
    function seed() { P = []; var n = Math.round(Math.min(90, W * H / 9000)); for (var i = 0; i < n; i++) P.push({ x: Math.random() * W, y: Math.random() * H, r: Math.random() * 1.6 + .3, v: Math.random() * .25 + .05, p: Math.random() * 6.3 }); }
    function frame(t) {
      if (!run || !c.isConnected) return;
      x.clearRect(0, 0, W, H);
      P.forEach(function (p) {
        if (!rm) { p.y -= p.v; p.x += Math.sin((t / 2000) + p.p) * .12; if (p.y < -4) { p.y = H + 4; p.x = Math.random() * W; } }
        var a = .25 + .45 * (0.5 + 0.5 * Math.sin(t / 900 + p.p));
        x.fillStyle = "rgba(242,211,146," + a.toFixed(2) + ")"; x.beginPath(); x.arc(p.x, p.y, p.r, 0, 6.3); x.fill();
      });
      if (!rm) requestAnimationFrame(frame);
    }
    requestAnimationFrame(function () { size(); seed(); requestAnimationFrame(frame); });
    window.addEventListener("resize", function () { if (c.isConnected) { size(); seed(); if (rm) frame(0); } });
  }

  /* ---------- рендер ---------- */
  var SCREENS = [screenCover, s1, s2, s3, s4, s5, s6, s7, s8, s9, s10, s11, assemble, screenResult];
  function render() {
    var st = S.step;
    if (st > 1 && st < 13 && !S.b) st = S.step = 1;
    if (st === 13 && (!S.b || S.s2 == null)) st = S.step = 0;
    var y = window.scrollY, keep = app.dataset.step === String(st);
    app.textContent = "";
    app.dataset.step = st;
    app.appendChild(SCREENS[st]());
    if (keep) window.scrollTo(0, y);
    stickyBar(st === 13 && S.safe !== 2);
  }
  /* плавающая кнопка записи на длинном результате */
  var barEl = null, barTick = false;
  function stickyBar(on) {
    if (barEl) { barEl.remove(); barEl = null; }
    if (!on) return;
    var P = C.prices || {};
    barEl = h("div", { class: "sbar", "aria-hidden": "true" },
      h("button", { class: "sbar-tx", onclick: function () { var d = document.getElementById("r-doors"); if (d) d.scrollIntoView({ behavior: "smooth", block: "start" }); track("bar_more"); } },
        h("b", { text: "Нейросессия" + (P.nejro ? " · " + P.nejro : "") }), h("span", { text: "одна встреча · подробнее" })),
      h("button", { class: "btn btn-gold sbar-btn", onclick: function () { track("bar_book"); dm("nejro", decide()); }, text: "Записаться" }));
    document.body.appendChild(barEl);
    upd();
  }
  function upd() {
    if (!barEl) return;
    var top = document.querySelector(".res-top"), doors = document.getElementById("r-doors"), sheetOpen = document.querySelector(".sheet");
    var past = top ? top.getBoundingClientRect().bottom < 0 : false;
    var dr = doors ? doors.getBoundingClientRect() : null;
    var atDoors = dr ? dr.top < window.innerHeight && dr.bottom > 0 : false;
    var show = past && !atDoors && !sheetOpen;
    barEl.classList.toggle("on", show); barEl.setAttribute("aria-hidden", show ? "false" : "true");
  }
  window.addEventListener("scroll", function () { if (barTick) return; barTick = true; requestAnimationFrame(function () { barTick = false; upd(); }); }, { passive: true });

  window.KRUG_DEBUG = { set: function (o) { S = Object.assign(fresh(), o); save(false); render(); }, decide: function () { return decide(); }, state: function () { return S; } };
  load();
  if (!fromHash()) save(false);
  render();
})();
